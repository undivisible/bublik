<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>bublik</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            mono: ['"SF Mono"', '"Fira Code"', '"JetBrains Mono"', 'monospace'],
                        },
                        colors: {
                            cyan: {
                                400: '#00CED1',
                                500: '#00B7BA',
                            },
                        },
                        animation: {
                            'fade-in': 'fadeIn 0.2s ease-out forwards',
                            'fade-in-scale': 'fadeInScale 0.3s ease-out forwards',
                            'pop-in': 'popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
                            'pop-out': 'popOut 0.25s ease-in forwards',
                            'slide-up': 'slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                            'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
                            'breathe': 'breathe 4s ease-in-out infinite',
                        },
                        keyframes: {
                            fadeIn: {
                                '0%': { opacity: '0', transform: 'translate(-50%, 8px)' },
                                '100%': { opacity: '1', transform: 'translate(-50%, 0)' },
                            },
                            fadeInScale: {
                                '0%': { opacity: '0', transform: 'translate(-50%, -50%) scale(0.8)' },
                                '100%': { opacity: '1', transform: 'translate(-50%, -50%) scale(1)' },
                            },
            popIn: {
                                '0%': { opacity: '0', transform: 'translate(-50%, -50%) scale(0.3)', filter: 'blur(8px)' },
                                '60%': { opacity: '1', transform: 'translate(-50%, -50%) scale(1.15)' },
                                '100%': { opacity: '1', transform: 'translate(-50%, -50%) scale(1)', filter: 'blur(0)' },
                            },
                            popOut: {
                                '0%': { opacity: '1', transform: 'translate(-50%, -50%) scale(1)' },
                                '100%': { opacity: '0', transform: 'translate(-50%, -50%) scale(0.5)', filter: 'blur(4px)' },
                            },
                            slideUp: {
                                '0%': { opacity: '0', transform: 'translateY(8px)' },
                                '100%': { opacity: '1', transform: 'translateY(0)' },
                            },
                            pulseGlow: {
                                '0%, 100%': { boxShadow: '0 0 8px rgba(0, 206, 209, 0.2)' },
                                '50%': { boxShadow: '0 0 20px rgba(0, 206, 209, 0.4)' },
                            },
                            breathe: {
                                '0%, 100%': { opacity: '0.6' },
                                '50%': { opacity: '1' },
                            },
                        },
                    },
                },
            };
        </script>
        <link data-trunk rel="css" href="style/main.css" />
    </head>
    <body class="bg-[#0a0a0a] text-gray-200 font-mono select-none overflow-hidden w-full h-full m-0 p-0"></body>
</html>
