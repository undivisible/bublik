[package]
name = "bublik"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "BiquadFilterNode",
    "BiquadFilterType",
    "ChannelMergerNode",
    "ChannelSplitterNode",
    "GainNode",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "MediaStreamAudioDestinationNode",
    "MediaRecorder",
    "MediaRecorderErrorEvent",
    "MediaStream",
    "OscillatorNode",
    "OscillatorType",
    "StereoPannerNode",
    "ScriptProcessorNode",
    "AudioProcessingEvent",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "MouseEvent",
    "TouchEvent",
    "TouchList",
    "Touch",
    "WheelEvent",
    "KeyboardEvent",
    "EventTarget",
    "Event",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Storage",
    "Location",
    "DomRect",
    "PointerEvent",
    "Performance",
    "ResizeObserver",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "console",
] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4"
